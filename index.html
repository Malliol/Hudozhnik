<script>
const ws=[...document.querySelectorAll('.w')],lb=document.getElementById('lb');
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
ws.forEach(w=>w.hidden=b.dataset.f!=='all'&&w.dataset.c!==b.dataset.f)};
ws.forEach(w=>w.onclick=e=>{e.preventDefault();lb.firstChild.src=w.href;lb.classList.add('on')});
lb.onclick=()=>lb.classList.remove('on');
addEventListener('keydown',e=>e.key==='Escape'&&lb.classList.remove('on'));
